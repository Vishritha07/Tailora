<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Tailora</title>
  <link rel="stylesheet" href="styles(2).css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="logo">✂️ Tailora</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="tailoring.html">Online Tailoring</a></li>
      <li><a href="orders(2).html">My Orders</a></li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <!-- Breadcrumb -->
    <p style="margin-bottom: 1rem; color: var(--text-secondary);">
      <a href="index.html" style="color: var(--secondary); text-decoration: none;">Home</a> / Product Details
    </p>

    <!-- Product Detail Section -->
    <div class="product-detail">

     <img id="productImage"
       style="
         width: 400px;
         height: 500px;
         object-fit: cover;
         border-radius: 12px;
       ">

     <div class="product-detail-info">

       <h1 id="productName"></h1>

       <div class="price" id="productPrice"></div>

       <p class="description" id="productDescription"></p>

       <div style="margin-bottom: 1.5rem;">

        <p>
         <strong>Category:</strong>
         <span id="productCategory"></span>
        </p>

        <p>
         <strong>Available Sizes:</strong>
         <span id="productSizes"></span>
        </p>

    </div>

    <div style="display: flex; gap: 1rem;">

      <button class="btn btn-primary btn-block"
              id="placeOrderBtn">
        Place Order
      </button>

      <a
       href="customization.html"
       class="btn btn-outline btn-block"
        onclick="saveCustomizationProduct()"
        >
         Customize This
      </a>

    </div>

  </div>

</div>

<!-- Customer Reviews -->
<div class="section">
  <h2>Customer Reviews</h2>

  <!-- Reviews will appear here -->
  <div id="reviewsContainer"></div>

  <!-- Add Review -->
  <div style="margin-top: 2rem;">
    <h4 style="margin-bottom: 1rem;">Write a Review</h4>

    <div class="form-group">
      <label for="reviewName">Your Name</label>
      <input
        type="text"
        id="reviewName"
        placeholder="Enter your name"
      >
    </div>

    <div class="form-group">
      <label for="reviewRating">Rating</label>
      <select id="reviewRating">
        <option value="5">★★★★★ - 5 Stars</option>
        <option value="4">★★★★☆ - 4 Stars</option>
        <option value="3">★★★☆☆ - 3 Stars</option>
        <option value="2">★★☆☆☆ - 2 Stars</option>
        <option value="1">★☆☆☆☆ - 1 Star</option>
      </select>
    </div>

    <div class="form-group">
      <label for="reviewText">Your Review</label>
      <textarea
        id="reviewText"
        placeholder="Write your review here..."
        rows="4"
      ></textarea>
    </div>

    <button
      class="btn btn-primary"
      id="submitReviewBtn"
    >
      Submit Review
    </button>
  </div>
</div>
  </main>

  
  <script>

function saveCustomizationProduct() {

  const productName =
    document.getElementById("productName").innerText;

  const productImage =
    document.getElementById("productImage").src;


  localStorage.setItem(
    "selectedProductName",
    productName
  );

  localStorage.setItem(
    "selectedProductImage",
    productImage
  );

}

</script>

  <script type="module" src="product.js"></script>
</body>
</html>
